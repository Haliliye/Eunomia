name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      # Unit tests (mocked repositories) — fast, no external services needed.
      - name: Unit tests
        run: dotnet test tests/TodoApp.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"
        working-directory: backend

      # Integration tests spin up a real MongoDB via Testcontainers — the
      # ubuntu-latest runner has Docker preinstalled, so this works without
      # any extra setup (see backend/tests/TodoApp.IntegrationTests/README.md).
      - name: Integration tests
        run: dotnet test tests/TodoApp.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-tests.trx"
        working-directory: backend

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: 'backend/**/*.trx'
          reporter: dotnet-trx

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check + build
        run: npm run build
        working-directory: frontend
